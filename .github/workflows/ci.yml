name: AgenticQA Nexus CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agenticqa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality and Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      TEST_ENV: local
      LOG_LEVEL: info

      BASE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3000

      AI_PROVIDER: disabled
      AI_API_KEY: ''

      NEXUS_SHOP_HOST: 127.0.0.1
      NEXUS_SHOP_PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run quality gates
        run: npm run quality

      - name: Run full regression
        id: full-regression
        run: npm test

      - name: Preserve and analyze full-regression evidence
        if: ${{ always() && hashFiles('artifacts/intelligence/test-results.json') != '' }}
        env:
          INTELLIGENCE_RUN_TYPE: full-regression
          INTELLIGENCE_RUN_SOURCE: ci
          INTELLIGENCE_RUN_SCOPE: mixed
        run: npm run intelligence

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload AgenticQA intelligence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenticqa-intelligence
          path: artifacts/intelligence/
          if-no-files-found: ignore
          retention-days: 14
